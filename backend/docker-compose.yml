services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+asyncpg://payresolve:payresolve@postgres:5432/payresolve
  postgres:
    image: postgres:17
    environment: {POSTGRES_USER: payresolve, POSTGRES_PASSWORD: payresolve, POSTGRES_DB: payresolve}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U payresolve"], interval: 5s, timeout: 5s, retries: 10}
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
  celery-worker:
    build: .
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    env_file: .env
    depends_on: [rabbitmq,redis]
