[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "payresolve-ai-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "sqlalchemy>=2.0",
  "alembic>=1.16",
  "asyncpg>=0.30",
  "aiosqlite>=0.21",
  "httpx>=0.28",
  "redis>=6.4",
  "celery>=5.5",
  "qdrant-client>=1.15",
  "sentence-transformers>=5.1",
  "rank-bm25>=0.2.2",
  "langgraph>=0.6",
  "prometheus-client>=0.22",
  "python-multipart>=0.0.20",
  "pypdf>=6.0",
  "python-docx>=1.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
  "mypy>=1.17"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*", "alembic*", "tests*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Fail CI on correctness errors first; formatting cleanup is tracked separately.
select = ["E9", "F63", "F7", "F82"]
