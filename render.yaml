services:
  - type: web
    name: payresolve-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements-render.txt
    startCommand: python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: payresolve-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: payresolve-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGINS
        fromService:
          name: payresolve-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AUTH_DEMO_TOKEN
        generateValue: true
      - key: SEMANTIC_RAG_ENABLED
        value: "false"
      - key: ASYNC_INGESTION_ENABLED
        value: "false"

  - type: web
    name: payresolve-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: payresolve-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_DEMO_TOKEN
        fromService:
          name: payresolve-api
          type: web
          envVarKey: AUTH_DEMO_TOKEN
      - key: NEXT_PUBLIC_DEMO_ROLE
        value: admin

  - type: keyvalue
    name: payresolve-redis
    plan: free
    region: singapore
    ipAllowList: []

databases:
  - name: payresolve-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: payresolve
    user: payresolve
